[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-generator-poc"
version = "0.1.0"
description = "Generate a ready-to-run FastMCP server from an OpenAPI REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
mcp-generator = "mcp_generator.__main__:main"
mcp-generator-api = "mcp_generator.api:run"

[tool.setuptools.packages.find]
where = ["src"]
